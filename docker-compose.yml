services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncct_training}
      POSTGRES_USER: ${POSTGRES_USER:-ncct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncct} -d ${POSTGRES_DB:-ncct_training}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ncct:change-me-local-only@db:5432/ncct_training}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,testserver}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-key-replace-before-deployment}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-DemoOnly!2026}
      CAREER_AI_PROVIDER: ${CAREER_AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      CAREER_AI_TIMEOUT_SECONDS: ${CAREER_AI_TIMEOUT_SECONDS:-15}
      CAREER_CHAT_RATE_LIMIT_PER_MINUTE: ${CAREER_CHAT_RATE_LIMIT_PER_MINUTE:-12}
      CAREER_CHAT_MAX_INPUT_CHARS: ${CAREER_CHAT_MAX_INPUT_CHARS:-2000}
      BIOMETRIC_ENABLED: ${BIOMETRIC_ENABLED:-true}
      FACE_VERIFICATION_PROVIDER: ${FACE_VERIFICATION_PROVIDER:-demo}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:-local-biometric-key-replace-before-deployment}
      BIOMETRIC_ENCRYPTION_KEY_VERSION: ${BIOMETRIC_ENCRYPTION_KEY_VERSION:-v1}
      BIOMETRIC_MATCH_THRESHOLD: ${BIOMETRIC_MATCH_THRESHOLD:-0.90}
      BIOMETRIC_MANUAL_REVIEW_THRESHOLD: ${BIOMETRIC_MANUAL_REVIEW_THRESHOLD:-0.75}
      BIOMETRIC_LIVENESS_THRESHOLD: ${BIOMETRIC_LIVENESS_THRESHOLD:-0.025}
      BIOMETRIC_CHALLENGE_EXPIRE_SECONDS: ${BIOMETRIC_CHALLENGE_EXPIRE_SECONDS:-120}
      BIOMETRIC_FRAME_MAX_BYTES: ${BIOMETRIC_FRAME_MAX_BYTES:-2097152}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
