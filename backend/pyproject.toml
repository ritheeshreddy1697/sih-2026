[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ncct-training-platform-api"
version = "0.1.0"
description = "FastAPI backend for the NCCT cooperative training platform."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "cryptography>=44.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.9.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.12",
  "Pillow>=11.0.0",
  "qrcode[pil]>=8.0",
  "reportlab>=4.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pip-audit>=2.10.1",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "types-qrcode>=8.0.0",
  "types-reportlab>=4.2.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
