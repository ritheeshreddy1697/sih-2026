worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;
  client_max_body_size 55m;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
  limit_req_status 429;

  map $uri $response_cache_control {
    ~^/api/ "no-store";
    /health "no-store";
    /sw.js "no-cache, no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;
    add_header Cache-Control $response_cache_control always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/auth/login {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://backend:8000;
    }

    location ~ ^/api/v1/auth/(register|password-reset) {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://backend:8000;
    }

    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://backend:8000;
      proxy_read_timeout 120s;
    }

    location = /health {
      proxy_pass http://backend:8000;
    }

    location = /sw.js {
      try_files $uri =404;
    }

    location /assets/ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
