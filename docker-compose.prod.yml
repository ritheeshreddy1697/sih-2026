services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]

  migrate:
    build:
      context: ./backend
      target: production
    environment: &backend_environment
      ENVIRONMENT: production
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      BIOMETRIC_ENCRYPTION_KEY_FILE: /run/secrets/biometric_encryption_key
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?Set BACKEND_CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?Set FRONTEND_PUBLIC_URL}
      API_DOCS_ENABLED: "false"
      REFRESH_COOKIE_SECURE: "true"
      CAREER_AI_PROVIDER: ${CAREER_AI_PROVIDER:-local}
      BIOMETRIC_ENABLED: ${BIOMETRIC_ENABLED:-false}
      FACE_VERIFICATION_PROVIDER: ${FACE_VERIFICATION_PROVIDER:-demo}
    secrets:
      - database_url
      - jwt_secret_key
      - biometric_encryption_key
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  backend:
    build:
      context: ./backend
      target: production
    environment: *backend_environment
    secrets:
      - database_url
      - jwt_secret_key
      - biometric_encryption_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [private]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
    networks: [private]

networks:
  private:
    internal: false

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}
  database_url:
    file: ${DATABASE_URL_FILE:?Set DATABASE_URL_FILE}
  jwt_secret_key:
    file: ${JWT_SECRET_KEY_FILE:?Set JWT_SECRET_KEY_FILE}
  biometric_encryption_key:
    file: ${BIOMETRIC_ENCRYPTION_KEY_FILE:?Set BIOMETRIC_ENCRYPTION_KEY_FILE}
